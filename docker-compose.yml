# Run the JADX MCP server in a container.
#
#   cp .env.example .env && docker compose up -d
#
# All configuration lives in .env — this file only wires it up. To build from
# source instead of pulling the published image:
#
#   docker compose up -d --build

services:
  jadx-mcp-server:
    image: ${IMAGE:-ghcr.io/applone/jadx-mcp-server}:${IMAGE_TAG:-latest}

    # Prefer the image published to GHCR. Compose only falls back to building
    # when you ask for it explicitly (`--build`, `docker compose build`, or
    # PULL_POLICY=build in .env); the build stanza below exists for that case.
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jadx-mcp-server
    restart: unless-stopped

    # Every setting comes from .env; nothing is hardcoded here.
    env_file:
      - .env

    ports:
      - "${MCP_PUBLISH_ADDR:-127.0.0.1}:${MCP_PORT:-8651}:${MCP_PORT:-8651}"

    # JADX-GUI runs on the host, so host.docker.internal must resolve on Linux
    # too (Docker Desktop provides it natively).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # The server only reads decompiled data over HTTP — it needs no write access
    # to its own filesystem and no added capabilities.
    read_only: true
    tmpfs:
      - /tmp
      - /home/jadx/.cache

    # FastMCP's OAuth proxy persists dynamically registered clients here
    # (FASTMCP_HOME=/data in the image). A named volume rather than tmpfs so
    # registrations survive a restart — otherwise every MCP client holding a
    # cached client_id gets invalid_client until it re-registers.
    volumes:
      - jadx-mcp-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1g}
          cpus: "${CPU_LIMIT:-2}"

volumes:
  jadx-mcp-data:
